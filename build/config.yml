version: '3'

info:
  companyName: "sapaude"
  productName: "Pager"
  productIdentifier: "com.sapaude.pager"
  description: "AI coding agents status monitor for macOS"
  copyright: "(c) 2026, sapaude"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go build -buildvcs=false -gcflags=all="-l" -o bin/Pager .
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: ./bin/Pager
      type: primary
